plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace = 'app.heyrobot.core'
    compileSdk = rootProject.ext.robotCompileSdk
    buildToolsVersion = rootProject.ext.robotBuildTools
    defaultConfig { minSdk = rootProject.ext.robotMinSdk }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
// Pure Kotlin plus a few Android helpers (logging, storage). No engines: this module runs in every process.
// Coroutines for the turn runner (Turn.kt), the same version the app and :brain already use.
dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (android.jar's copy is a stub that throws). 1.1: kept at 20180813, which reads numbers as
    // Android's own org.json does (30.5 a Double); 20231013 and later read them as BigDecimal, so the tests would stop
    // modelling the phone. Its advisories (deep nesting, DoS) concern untrusted input, and here it parses only the tests' text.
    testImplementation 'org.json:json:20180813'
}
