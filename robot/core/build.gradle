plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
// As in the probe: a session init script adds a mirror to project repositories, which would otherwise make
// Gradle ignore the settings' repositories.
repositories { google(); mavenCentral() }
android {
    namespace 'app.heyrobot.core'
    compileSdk rootProject.ext.robotCompileSdk
    defaultConfig { minSdk rootProject.ext.robotMinSdk }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// Pure Kotlin plus a few Android helpers (logging, storage). No engines: this module runs in every process.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (android.jar's copy is a stub that throws).
    testImplementation 'org.json:json:20180813'
}
