plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
// Declared here too: a Gradle init script that adds a mirror to project repositories would otherwise make
// Gradle ignore the settings' repositories.
repositories { google(); mavenCentral() }
android {
    namespace 'app.heyrobot.core'
    compileSdk rootProject.ext.robotCompileSdk
    buildToolsVersion rootProject.ext.robotBuildTools
    defaultConfig { minSdk rootProject.ext.robotMinSdk }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// Pure Kotlin plus a few Android helpers (logging, storage). No engines: this module runs in every process.
// Coroutines for the turn runner (Turn.kt), the same version the app and :brain already use.
dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (android.jar's copy is a stub that throws).
    testImplementation 'org.json:json:20180813'
}
