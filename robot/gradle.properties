android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g
kotlin.code.style=official
android.nonTransitiveRClass=true
# 1.0.1: tasks run in parallel across modules and their outputs are reused from Gradle's build cache (~/.gradle). The
# unit tests declare the files they read as inputs (build.gradle), so a cached result is never one from before a change.
# The debug APK is the same either way (checked byte for byte with and without both, and rebuilt from the cache).
org.gradle.caching=true
org.gradle.parallel=true
