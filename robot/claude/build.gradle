plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
repositories { google(); mavenCentral() }
android {
    namespace 'app.heyrobot.claude'
    compileSdk rootProject.ext.robotCompileSdk
    defaultConfig {
        minSdk rootProject.ext.robotMinSdk
        // Applies only if the app is ever minified (it isn't today): keeps the SDK's Jackson-bound models intact.
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// The :voice process's link to the Claude API (docs/ask-claude.md): the only module that uses the official Anthropic Java
// SDK (MIT; its OkHttp client, Jackson and Kotlin reflection come with it, see THIRD_PARTY.md). Only the app's assistant
// package (the :voice process) depends on it; the main process never loads it (ProcessIsolationTest, verify_apk.sh).
dependencies {
    implementation project(':core')
    implementation 'com.anthropic:anthropic-java:2.71.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    // Network tests against a local mock server through the SDK's base-URL override: no real key, no network.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
