// SPDX-License-Identifier: GPL-3.0-only
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
// Release signing: the keystore and its password stay outside the repository. Point at them with
// Gradle properties (-Probot.keystore=... -Probot.keystorePassFile=...) or the environment variables
// ROBOT_KEYSTORE / ROBOT_KEYSTORE_PASS_FILE. The password file holds the password on its first line.
def ksPath = project.findProperty('robot.keystore') ?: System.getenv('ROBOT_KEYSTORE')
def ksPassFile = project.findProperty('robot.keystorePassFile') ?: System.getenv('ROBOT_KEYSTORE_PASS_FILE')

android {
    namespace = 'app.heyrobot'
    compileSdk = rootProject.ext.robotCompileSdk
    buildToolsVersion = rootProject.ext.robotBuildTools
    defaultConfig {
        // 1.0: robot-app.ai reversed (a package name can't hold the hyphen); 0.9 and earlier were app.heyrobot, so 1.0 installs
        // beside them as another app (README, "Moving from 0.9 to 1.0"). The namespace and the Kotlin packages stay app.heyrobot.
        applicationId 'ai.robot_app'
        minSdk = rootProject.ext.robotMinSdk
        targetSdk = rootProject.ext.robotTargetSdk
        // From 1.0 (a new app ID, so no earlier codes to follow): major*1000000 + minor*10000 + patch*100, plus the release
        // candidate's number (rc1 = 1) or 99 for the release itself. 1.0.0-rc1 = 1000001, 1.0.0 = 1000099, 1.0.1 = 1000199.
        // tools/bump_version.sh sets both, and makes the fastlane changelog; nothing else repeats them.
        versionCode 1000199
        versionName '1.0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (ksPath != null && ksPassFile != null) {
                def pw = new File(ksPassFile.toString()).readLines().first().trim()
                storeFile file(ksPath.toString())
                storeType 'pkcs12'
                storePassword pw
                keyAlias 'robot'
                keyPassword pw
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        // No minify: sherpa-onnx's JNI reads the Kotlin config classes' fields by name, and
        // LiteRT-LM calls back into its Kotlin classes from native code.
        release {
            minifyEnabled false
            if (ksPath != null && ksPassFile != null) signingConfig = signingConfigs.release
            // No META-INF/version-control-info.textproto: it holds the commit the APK was built from, so the same source
            // built from a tarball or another clone would differ (tools/verify_apk.sh checks it's absent).
            vcsInfo { include = false }
        }
    }
    // No dependency-info block in the APK's signing block (id 0x504b4453, encrypted with Google's key, readable by Google
    // Play alone) and none in a bundle: IzzyOnDroid and F-Droid ask for it removed (tools/verify_apk.sh checks it).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    buildFeatures { compose = true; buildConfig = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['onnx'] }
    // Native packaging as in my earlier test apps (Off Grid PR #702): extracted libraries, so
    // Backend.NPU(nativeLibraryDir) finds the dispatch library (and the manifest's extractNativeLibs="true"): the libraries
    // are compressed in the APK and Android unpacks them into nativeLibraryDir at install, where System.loadLibrary,
    // LiteRT's dispatch library lookup, sherpa-onnx, librobotmt and the isolated :llama process find them. 0.8: the dex
    // files are compressed too (AGP stores them uncompressed by default for minSdk 28 and up, about 70 MB here; Android
    // reads them through the package manager's dexopt either way, nothing loads them from the APK), so the APK stays
    // well under GitHub's 100 MB per file. Still no R8: JNI looks classes and fields up by name (buildTypes, above).
    packaging {
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
            excludes.add('**/libLiteRtCompilerPlugin_google_tensor.so')
            pickFirsts.add('**/libLiteRtDispatch_GoogleTensor.so')
        }
        // META-INF/AL2.0 and LGPL2.1 used to be excluded here, copied from an early template: older kotlinx-coroutines
        // jars each carried a copy, and duplicates fail the packaging. No jar Robot uses today has them (coroutines 1.11.0
        // doesn't). A licence text a library ships is kept, one copy (pickFirst), never dropped; Settings › About ›
        // Licences has the full texts and notices anyway (assets/licenses/, and :brain's AAR notices).
        resources {
            excludes += ['META-INF/*.kotlin_module']
            pickFirsts += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
    testOptions {
        // Compose UI tests and screenshots run on the JVM with Robolectric, in the debug unit tests only (src/testDebug):
        // their host activity comes from ui-test-manifest, which only the debug build has.
        unitTests.includeAndroidResources = true
        unitTests.all {
            it.systemProperty 'robot.rootDir', rootProject.projectDir.absolutePath
            it.systemProperty 'robot.variant', it.name.contains('Release') ? 'release' : 'debug'
        }
    }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

// Robolectric's Android runtime (SDK 35) is an ordinary Gradle dependency, cached like any other, and Robolectric runs
// offline from it: nothing is fetched while the tests run. Screenshots are checked against the goldens in
// src/testDebug/screenshots; -Droborazzi.record=true writes them instead.
configurations { robolectricRuntime }
tasks.matching { it.name == 'testDebugUnitTest' }.configureEach { t ->
    t.inputs.files(configurations.robolectricRuntime)
    t.systemProperty 'robolectric.offline', 'true'
    t.doFirst { t.systemProperty 'robolectric.dependency.dir', configurations.robolectricRuntime.singleFile.parentFile.absolutePath }
    def record = System.getProperty('roborazzi.record', 'false') == 'true'
    t.systemProperty 'roborazzi.test.record', record.toString()
    t.systemProperty 'roborazzi.test.verify', (!record).toString()
}

// Settings › About › Licences: every library the release build packs, one "group:artifact:version" a line, for LicencesTest
// (each must belong to an entry of assets/licenses/components.json).
def releaseRuntimeArtifacts = tasks.register('releaseRuntimeArtifacts') {
    def runtime = configurations.named('releaseRuntimeClasspath')
    def out = layout.buildDirectory.file('robot/release-runtime-artifacts.txt')
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
        def ids = runtime.get().incoming.resolutionResult.allComponents.collect { it.id }
            .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .collect { "${it.group}:${it.module}:${it.version}" }.unique().sort()
        out.get().asFile.text = ids.join('\n') + '\n'
    }
}

// The isolation test also reads the merged manifest of the variant under test; LicencesTest the libraries above and the
// licence files :brain copies out of its AARs.
tasks.matching { it.name == 'testDebugUnitTest' }.configureEach { dependsOn 'processDebugMainManifest', releaseRuntimeArtifacts, ':brain:aarNotices' }
tasks.matching { it.name == 'testReleaseUnitTest' }.configureEach { dependsOn 'processReleaseMainManifest', releaseRuntimeArtifacts, ':brain:aarNotices' }

dependencies {
    implementation project(':core')
    implementation project(':voice')
    implementation project(':brain')
    // 0.5.0: the fast translation engine's :mt process (MtService, librobotmt.so when tools/build_robotmt.sh built it).
    implementation project(':mt')
    // Ask Claude: the Anthropic SDK, used only by the assistant package (the :voice process).
    implementation project(':helpers')

    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'

    // UI tests (debug unit tests only; none of this is in the release APK). ui-test-manifest adds the test host activity
    // to the debug build, not exported (src/debug/AndroidManifest.xml).
    robolectricRuntime('org.robolectric:android-all-instrumented:15-robolectric-13954326-i7') { transitive = false }
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testDebugImplementation platform('androidx.compose:compose-bom:2025.06.01')
    testDebugImplementation 'androidx.compose.ui:ui-test-junit4'
    testDebugImplementation 'org.robolectric:robolectric:4.16.1'
    testDebugImplementation 'io.github.takahirom.roborazzi:roborazzi:1.49.0'
    testDebugImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.49.0'
    testDebugImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.49.0'
}
