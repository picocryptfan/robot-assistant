plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace = 'app.heyrobot.wiki'
    compileSdk = rootProject.ext.robotCompileSdk
    buildToolsVersion = rootProject.ext.robotBuildTools
    defaultConfig { minSdk = rootProject.ext.robotMinSdk }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
// The :wiki process (docs/plans/wikipedia-offline-plan.md §3, job P1): Wikipedia on this phone, the only module with
// librobotzim.so (openZIM's libzim, Xapian, zstd, xz, ICU). tools/build_libzim.sh builds the library from src/main/cpp and
// pinned sources into src/main/jniLibs (not in git), where the build packages it; without it this module still builds and
// WikiService answers that the reader isn't in this build. Gradle never runs the native build. No dependency: the
// reader needs nothing of Robot's.
apply from: rootProject.file('gradle/robolectric-tests.gradle')
